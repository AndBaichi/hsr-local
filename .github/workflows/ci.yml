name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck / test / lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  rust-selftest:
    name: Rust selftest (real datapack)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build datapack
        env:
          HSR_VERSION: 4.7.51
        run: npm run datapack:full
      - name: Prepare builtin datapack
        env:
          HSR_VERSION: 4.7.51
        run: npm run builtin:pack

      - name: Run selftest against real datapack
        env:
          HSR_SELFTEST_PACK: data/datapack
          RUST_BACKTRACE: 1
        run: cargo run --manifest-path src-tauri/Cargo.toml --bin selftest
